spring.application.name=resume-ai-saas

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Google GenAI Configuration
spring.ai.google.genai.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.embedding.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Supabase project URL (used to resolve JWKS endpoint)
supabase.url=${SUPABASE_URL}

# Supabase Storage (S3-compatible)
supabase.storage.endpoint=${SUPABASE_STORAGE_ENDPOINT}
supabase.storage.region=${SUPABASE_STORAGE_REGION}
supabase.storage.access-key-id=${SUPABASE_STORAGE_ACCESS_KEY_ID}
supabase.storage.secret-access-key=${SUPABASE_STORAGE_SECRET_ACCESS_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
